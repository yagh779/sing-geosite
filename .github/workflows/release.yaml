name: Release
on:
  workflow_dispatch:
    inputs:
      no_skip:
        description: 'Force rebuild even if upstream unchanged'
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26
      - name: Build rule sets
        id: build
        env:
          NO_SKIP: ${{ inputs.no_skip == true && 'true' || 'false' }}
        run: |
          go run -v .
      - name: Release rule sets
        if: steps.build.outputs.skip != 'true'
        run: .github/release-rule-set.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
