name: Release
on:
  workflow_dispatch:
    inputs:
      no_skip:
        description: 'Force rebuild even if upstream unchanged'
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.26
      - name: Build rule sets
        id: build
        env:
          NO_SKIP: ${{ inputs.no_skip == true && 'true' || 'false' }}
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run -v .
      - name: Commit tag state
        if: steps.build.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sync-state.json
          if git diff --cached --quiet; then
            echo "No tag state change."
          else
            git commit -m "chore: update tag fingerprints"
            git push origin HEAD:main
          fi
      - name: Release rule sets
        if: steps.build.outputs.skip != 'true'
        run: .github/release-rule-set.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
