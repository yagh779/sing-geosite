name: Build
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ^1.26

      - name: Build rule sets
        id: build
        env:
          NO_SKIP: true
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run -v .

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: rule-set
          path: rule-set
